# Publishes a GitHub release with the addon zip whenever a new version shows
# up at the top of CHANGELOG.md on main ("## 2.14.1"). WowUp Hub picks the
# release up by itself.
#
# New version: add a "## <version>" section at the top of CHANGELOG.md and
# push it to main. Everything else happens here. A version that already has
# a release is left alone, so ordinary pushes do nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADDON: AllInOneForever
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from CHANGELOG.md
        id: version
        run: |
          VERSION="$(awk '/^## [0-9]/ {print $2; exit}' CHANGELOG.md)"
          if [ -z "$VERSION" ]; then echo "No version in CHANGELOG.md"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists already, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p "build/$ADDON"
          git archive --format=tar HEAD | tar -x -C "build/$ADDON"
          sed -i "s/^## Version:.*/## Version: $VERSION/" "build/$ADDON/$ADDON.toc"
          # WoW Forever's own toc name, so updaters see the game version at once.
          cp "build/$ADDON/$ADDON.toc" "build/$ADDON/${ADDON}_Forever.toc"
          (cd build && zip -qr "$ADDON-$VERSION.zip" "$ADDON")
          # release.json (BigWigs packager format): tells WowUp Hub the zip is for WoW Forever.
          INTERFACE="$(awk -F': *' '/^## Interface:/ {print $2; exit}' "$ADDON.toc" | tr -d '\r')"
          printf '{"releases":[{"name":"%s","version":"%s","filename":"%s-%s.zip","nolib":false,"metadata":[{"flavor":"forever","interface":%s}]}]}\n' \
            "$ADDON" "$VERSION" "$ADDON" "$VERSION" "$INTERFACE" > build/release.json

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " {p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Version $VERSION" > notes.md

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        run: |
          gh release create "v$VERSION" "build/$ADDON-$VERSION.zip" build/release.json \
            --target "$GITHUB_SHA" --title "$ADDON $VERSION" --notes-file notes.md
